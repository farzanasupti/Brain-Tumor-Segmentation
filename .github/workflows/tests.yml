name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    # Splitting logic is stdlib-only, so it can be checked in seconds and across
    # Python versions without paying for a torch install. A tuple passed to
    # random.Random once broke here on 3.11+ while working on 3.10.
    name: stdlib (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile every module
        run: python -m compileall -q . -x '(\.git|legacy)'

      - name: Stdlib suites
        run: python run_tests.py test_folds

      - name: Splits reproduce from the committed manifest
        run: |
          python splits.py --manifest data/manifest.csv --protocol patient
          python folds.py --manifest data/manifest.csv --folds data/folds.csv --show 0

  full:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU torch, then the rest
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Report which backbones this environment can build
        run: python -m backbones

      - name: Run every suite
        run: python run_tests.py
